<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유니머니 프로토타입 V3 (커스텀 이미지)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-phone: #f4f5f7;
            --bg-app-main: #fff0f2;
            --color-primary: #ff6b8b;
            --color-text-dark: #2d3748;
            --color-text-light: #718096;
            --phone-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 스마트폰 테두리 기기 프레임 */
        .phone-frame {
            width: 375px;
            height: 812px;
            background-color: #1a202c;
            border-radius: 44px;
            padding: 12px;
            box-shadow: var(--phone-shadow);
            position: relative;
            border: 4px solid #2d3748;
        }

        .phone-notch {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 28px;
            background-color: #000;
            border-radius: 20px;
            z-index: 1000;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background-color: #fff;
            border-radius: 34px;
            overflow: hidden;
            position: relative;
        }

        .status-bar {
            height: 40px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 999;
            color: #2d3748;
        }

        .status-icons span { margin-left: 5px; }

        /* ==========================================
           1. 휴대폰 기본 홈 화면 (phone_bg.jpg.jpg 적용)
           ========================================== */
        .view-home {
            width: 100%; height: 100%;
            background-color: #fff0f2;
            background-image: url('phone_bg.jpg.jpg');
            background-size: cover;
            background-position: center;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            position: absolute; top: 0; left: 0;
            z-index: 10; transition: opacity 0.5s ease;
        }

        .app-icon-wrapper {
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: transform 0.2s ease;
        }
        .app-icon-wrapper:active { transform: scale(0.9); }

        .app-icon {
            width: 75px; height: 75px;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 8px;
            background: none; padding: 0; overflow: hidden;
        }
        .app-icon img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .app-name {
            font-size: 14px; font-weight: 700; color: #fff;
            text-shadow: 0px 1px 3px rgba(0,0,0,0.6);
        }

        /* ==========================================
           2. 앱 로딩 대기 화면 (splash_img.jpg.jpeg 적용)
           ========================================== */
        .view-splash {
            width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            position: absolute; top: 0; left: 0;
            z-index: 20; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .view-splash.active { opacity: 1; pointer-events: auto; }

        .splash-logo {
            width: 180px; height: 180px;
            margin-bottom: 20px;
            animation: bounce 2s infinite ease-in-out;
        }
        .splash-logo img {
            width: 100%; height: 100%; object-fit: contain;
        }
        
        .splash-title {
            font-size: 24px; font-weight: 900;
            color: var(--color-text-dark); letter-spacing: 2px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ==========================================
           3. 메인 앱 화면 구성 (main_pig.jpg.jpeg 적용)
           ========================================== */
        .view-app {
            width: 100%; height: 100%;
            background-color: #fafafa;
            display: flex; flex-direction: column;
            position: absolute; top: 0; left: 0;
            z-index: 30; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .view-app.active { opacity: 1; pointer-events: auto; }

        .app-header {
            height: 88px; padding: 40px 20px 0 20px;
            display: flex; justify-content: space-between; align-items: center;
            background-color: white; border-bottom: 1px solid #f0f0f0;
        }

        .btn-menu, .btn-alarm {
            font-size: 22px; color: var(--color-text-dark);
            cursor: pointer; width: 36px; height: 36px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 50%; transition: background 0.2s;
        }
        .btn-menu:active, .btn-alarm:active { background-color: #f7fafc; }

        .app-title { font-size: 17px; font-weight: 700; color: var(--color-text-dark); }

        .app-content {
            flex: 1; overflow-y: auto;
            padding: 20px; padding-bottom: 90px;
            display: flex; flex-direction: column;
        }

        /* 자산 현황 (상단 배치) */
        .balance-card {
            background-color: white; border-radius: 24px;
            padding: 22px; text-align: center;
            box-shadow: 0 4px 18px rgba(0,0,0,0.02);
            margin-bottom: 30px;
        }
        .balance-label { font-size: 14px; font-weight: 700; color: var(--color-text-dark); margin-bottom: 8px; }
        .balance-amount { font-size: 28px; font-weight: 900; color: var(--color-primary); }

        /* 중앙 돼지 마스코트 영역 */
        .piggy-content-area {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .piggy-image-box {
            width: 240px; height: 240px;
            display: flex; justify-content: center; align-items: center;
        }
        .piggy-char-img {
            width: 100%; height: 100%; object-fit: contain;
        }
        .status-badge {
            margin-top: 15px; background: #ffb6c1; color: white;
            padding: 8px 20px; border-radius: 20px;
            font-weight: bold; font-size: 14px;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.4);
        }

        /* ==========================================
           4. 하단 탭 네비게이션
           ========================================== */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 76px;
            background-color: rgba(255, 255, 255, 0.94); backdrop-filter: blur(10px);
            border-top: 1px solid #f0f0f0;
            display: flex; justify-content: space-around; align-items: center;
            padding-bottom: 12px; z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: #a0aec0; cursor: pointer; text-decoration: none; flex: 1;
        }
        .nav-item.active { color: var(--color-primary); }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }
        .nav-label { font-size: 10px; font-weight: 500; }

        /* ==========================================
           5. 슬라이딩 사이드 드로어 메뉴
           ========================================== */
        .drawer-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.4); z-index: 500;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .drawer-overlay.active { opacity: 1; pointer-events: auto; }

        .drawer-menu {
            position: absolute; top: 0; left: -280px;
            width: 280px; height: 100%; background-color: white; z-index: 501;
            box-shadow: 10px 0 30px rgba(0,0,0,0.1); transition: left 0.3s ease;
            padding: 60px 24px 24px 24px; display: flex; flex-direction: column;
        }
        .drawer-menu.active { left: 0; }

        .drawer-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
        .drawer-item {
            padding: 14px 16px; border-radius: 12px; color: var(--color-text-dark);
            font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 12px;
        }
        .drawer-item:active { background-color: #fff0f2; color: var(--color-primary); }
        .drawer-item-icon { font-size: 16px; width: 20px; }
        
        /* 모달 팝업 */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5); z-index: 1000;
            display: flex; justify-content: center; align-items: center; padding: 30px;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .custom-modal {
            background-color: white; width: 100%; border-radius: 24px; padding: 24px;
            text-align: center; transform: scale(0.9); transition: transform 0.2s ease;
        }
        .modal-overlay.active .custom-modal { transform: scale(1); }
        .btn-modal-close {
            width: 100%; padding: 12px; background-color: var(--color-primary);
            color: white; border: none; border-radius: 12px; font-size: 14px;
            font-weight: 700; cursor: pointer; margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="phone-notch"></div>
        <div class="phone-screen">
            
            <div class="status-bar">
                <div class="status-time">12:30</div>
                <div class="status-icons"><span>📶</span><span>🔋</span></div>
            </div>

            <div class="view-home" id="viewHome">
                <div class="app-icon-wrapper" onclick="launchApp()">
                    <div class="app-icon">
                        <img src="app_icon.png.png" alt="앱 아이콘">
                    </div>
                    <div class="app-name">유니머니</div>
                </div>
            </div>

            <div class="view-splash" id="viewSplash">
                <div class="splash-logo">
                    <img src="splash_img.jpg.jpeg" alt="대기 화면 이미지">
                </div>
                <div class="splash-title">UNIMONEY</div>
            </div>

            <div class="view-app" id="viewApp">
                <div class="app-header">
                    <div class="btn-menu" onclick="toggleDrawer(true)">☰</div>
                    <div class="app-title">유니머니</div>
                    <div class="btn-alarm" onclick="showModal('알림센터', '새로운 알림이 없습니다.')">🔔</div>
                </div>

                <div class="app-content">
                    <div class="balance-card">
                        <div class="balance-label">이번 달 남은 권장 예산</div>
                        <div class="balance-amount">342,500 원</div>
                    </div>

                    <div class="piggy-content-area">
                        <div class="piggy-image-box">
                            <img class="piggy-char-img" src="main_pig.jpg.jpeg" alt="메인 돼지">
                        </div>
                        <div class="status-badge">아주 잘 절약하고 있어요!</div>
                    </div>
                </div>

                <div class="bottom-nav">
                    <div class="nav-item" onclick="showModal('안내', '해당 뷰는 아직 준비 중입니다.')"><div class="nav-icon">📅</div><div class="nav-label">캘린더</div></div>
                    <div class="nav-item" onclick="showModal('안내', '해당 뷰는 아직 준비 중입니다.')"><div class="nav-icon">📊</div><div class="nav-label">리포트</div></div>
                    <div class="nav-item" onclick="showModal('안내', '해당 뷰는 아직 준비 중입니다.')"><div class="nav-icon">⚙️</div><div class="nav-label">설정</div></div>
                    <div class="nav-item active"><div class="nav-icon">🐷</div><div class="nav-label">홈</div></div>
                </div>
            </div>

            <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer(false)"></div>
            <div class="drawer-menu" id="drawerMenu">
                <h3 style="color: var(--color-primary); padding-left: 10px;">상세 메뉴</h3>
                <ul class="drawer-list">
                    <li class="drawer-item" onclick="showModal('안내', 'AI 대화 기능 준비 중입니다.')"><span class="drawer-item-icon">🤖</span> AI 소비현황</li>
                    <li class="drawer-item" onclick="showModal('안내', 'AI 추천 혜택 기능 준비 중입니다.')"><span class="drawer-item-icon">🎁</span> AI 추천 혜택</li>
                    <li class="drawer-item" onclick="showModal('안내', '계좌 연동 기능 준비 중입니다.')"><span class="drawer-item-icon">🔗</span> 계좌 연동</li>
                    <li class="drawer-item" onclick="showModal('안내', '분류 설정 기능 준비 중입니다.')"><span class="drawer-item-icon">🏷️</span> 분류 설정</li>
                    <li class="drawer-item" onclick="showModal('안내', '데이터 내보내기 기능 준비 중입니다.')"><span class="drawer-item-icon">💾</span> 데이터 내보내기</li>
                </ul>
            </div>

            <div class="modal-overlay" id="customModalOverlay">
                <div class="custom-modal">
                    <h3 id="modalTitle" style="margin-bottom: 15px; color: var(--color-text-dark);">알림</h3>
                    <p id="modalText" style="color: var(--color-text-light); font-size: 14px; margin-bottom: 10px;">내용</p>
                    <button class="btn-modal-close" onclick="closeModal()">확인</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        function launchApp() {
            const home = document.getElementById('viewHome');
            const splash = document.getElementById('viewSplash');
            const appMain = document.getElementById('viewApp');

            home.style.opacity = '0';
            setTimeout(() => { home.style.display = 'none'; }, 500);

            splash.classList.add('active');

            setTimeout(() => {
                splash.classList.remove('active');
                appMain.classList.add('active');
            }, 3000);
        }

        function toggleDrawer(open) {
            const overlay = document.getElementById('drawerOverlay');
            const menu = document.getElementById('drawerMenu');
            if (open) {
                overlay.classList.add('active');
                menu.classList.add('active');
            } else {
                overlay.classList.remove('active');
                menu.classList.remove('active');
            }
        }

        function showModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            document.getElementById('customModalOverlay').classList.add('active');
            toggleDrawer(false);
        }

        function closeModal() {
            document.getElementById('customModalOverlay').classList.remove('active');
        }
    </script>
</body>
</html>
