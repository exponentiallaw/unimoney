<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIMONEY Prototype</title>
    <style>
        /* 기본 스타일 및 외부 텍스트 배치 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .side-text {
            position: absolute;
            font-size: 2.5rem;
            font-weight: 900;
            color: #d1d5db;
            user-select: none;
            z-index: 1;
            text-transform: uppercase;
        }
        .text-left { left: 5%; transform: rotate(-90deg); transform-origin: left center; }
        .text-right { right: 5%; transform: rotate(90deg); transform-origin: right center; }

        /* 스마트폰 테두리 및 화면 컨테이너 */
        .phone-container {
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 44px;
            padding: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 10;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 34px;
            overflow: hidden;
            position: relative;
        }

        /* 다이내믹 아일랜드 (상단 바) */
        .notch {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 30px;
            background: #000;
            border-radius: 20px;
            z-index: 1000;
        }

        /* 공통 화면 스타일 */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }
        .screen.active { display: flex; flex-direction: column; }

        /* -------------------------------------------
           ① 휴대폰 홈 화면 (이중 확장자 phone_bg.jpg.jpg 반영)
        ------------------------------------------- */
        #view-phone-home {
            background-image: url('phone_bg.jpg.jpg'); 
            background-size: cover;
            background-position: center;
            padding: 60px 20px 20px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .app-icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 5px;
            padding: 0; 
            overflow: hidden; 
            background: none; 
        }

        .app-name {
            font-size: 0.75rem;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* -------------------------------------------
           ② 대기 화면 (스플래시 이미지)
        ------------------------------------------- */
        #view-splash {
            background: #fff;
            justify-content: center;
            align-items: center;
        }
        .splash-logo {
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }

        /* -------------------------------------------
           ③ 가계부 앱 메인 화면
        ------------------------------------------- */
        #view-main {
            background: #fff;
            padding-top: 50px;
        }

        /* 좌측 상단 버튼 영역 (메뉴 & 알림 세로 배치) */
        .header-controls {
            position: absolute;
            top: 55px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            background: #fff;
            border: 2px solid #ffb6c1;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
            color: #ff69b4;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        /* 잔액 표시 영역 */
        .balance-container {
            text-align: center;
            margin-top: 30px;
            padding: 0 30px;
        }

        .balance-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .balance-input-wrap {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            border-bottom: 3px solid #333;
            margin: 10px auto;
            width: 80%;
        }

        .balance-input {
            border: none;
            outline: none;
            font-size: 2rem;
            font-weight: bold;
            text-align: right;
            width: 70%;
            background: transparent;
        }

        .currency-unit {
            font-size: 1.5rem;
            font-weight: bold;
            margin-left: 5px;
            margin-bottom: 4px;
        }

        /* 중앙 고정 돼지 마스코트 영역 */
        .piggy-content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .piggy-image-box {
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .piggy-char-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 하단 탭바 메뉴 */
        .bottom-nav {
            height: 75px;
            border-top: 2px solid #eee;
            display: flex;
            background: #fff;
            padding-bottom: 10px;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #777;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
        }

        .nav-item.active { color: #ff69b4; }
        .nav-icon { font-size: 1.4rem; margin-bottom: 3px; }

        /* 사이드 메뉴 */
        .side-menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 500;
            display: none;
        }

        .side-menu {
            position: absolute;
            top: 0; left: -260px; width: 260px; height: 100%;
            background: #fff;
            z-index: 600;
            transition: left 0.3s ease;
            padding: 70px 20px 20px;
            display: flex;
            flex-direction: column;
            border-top-right-radius: 34px;
            border-bottom-right-radius: 34px;
        }

        .side-menu.open { left: 0; }
        .side-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff69b4;
            margin-bottom: 25px;
            border-bottom: 2px solid #ffb6c1;
            padding-bottom: 10px;
        }

        .menu-list { list-style: none; }
        .menu-item {
            padding: 14px 10px;
            font-size: 1rem;
            color: #444;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 5px;
        }
        .menu-item:hover { background: #fff0f2; color: #ff69b4; }
    </style>
</head>
<body>

    <div class="side-text text-left">AIDT 팀 프로젝트</div>
    <div class="side-text text-right">UNIMONEY</div>

    <div class="phone-container">
        <div class="notch"></div>
        <div class="phone-screen">

            <div id="view-phone-home" class="screen active">
                <div class="app-grid">
                    <div class="app-icon-wrapper" onclick="startApp()">
                        <div class="app-icon">
                            <img src="app_icon.png.png" alt="유니머니 아이콘" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                        <div class="app-name">유니머니</div>
                    </div>
                </div>
            </div>

            <div id="view-splash" class="screen">
                <img class="splash-logo" src="splash_img.jpg.jpeg" alt="대기화면">
            </div>

            <div id="view-main" class="screen">
                
                <div class="header-controls">
                    <div class="icon-btn" onclick="toggleMenu(true)">☰</div>
                    <div class="icon-btn" onclick="alert('새로운 알림 내역이 없습니다!')">🔔</div>
                </div>

                <div class="balance-container">
                    <div class="balance-title">잔액 :</div>
                    <div class="balance-input-wrap">
                        <input type="number" id="input-balance" class="balance-input" value="150000">
                        <span class="currency-unit">원</span>
                    </div>
                </div>

                <div class="piggy-content-area">
                    <div class="piggy-image-box">
                        <img class="piggy-char-img" src="main_pig.jpg.jpeg" alt="유니머니 마스코트">
                    </div>
                </div>

                <div class="bottom-nav">
                    <div class="nav-item" onclick="alert('캘린더 화면으로 이동')">
                        <span class="nav-icon">📅</span>
                        <span>캘린더</span>
                    </div>
                    <div class="nav-item" onclick="alert('AI 추천 혜택 화면으로 이동')">
                        <span class="nav-icon">✨</span>
                        <span>AI 추천 혜택</span>
                    </div>
                    <div class="nav-item" onclick="alert('분류 설정 화면으로 이동')">
                        <span class="nav-icon">📊</span>
                        <span>분류설정</span>
                    </div>
                    <div class="nav-item active">
                        <span class="nav-icon">🐷</span>
                        <span>UNI MONEY</span>
                    </div>
                </div>

                <div class="side-menu-overlay" id="menu-overlay" onclick="toggleMenu(false)"></div>
                <div class="side-menu" id="side-menu">
                    <div class="side-title">AI 대화 메뉴</div>
                    <ul class="menu-list">
                        <li class="menu-item" onclick="alert('소비 현황 리포트')">📊 소비 현황</li>
                        <li class="menu-item" onclick="alert('AI 추천 혜택 목록')">💡 AI 추천 혜택</li>
                        <li class="menu-item" onclick="alert('계좌 연동 관리')">🔗 계좌연동</li>
                        <li class="menu-item" onclick="alert('캘린더 보기')">📅 캘린더</li>
                        <li class="menu-item" onclick="alert('소비 통계 리포트')">📈 리포트 (통계)</li>
                        <li class="menu-item" onclick="alert('카테고리 설정')">⚙️ 분류설정</li>
                        <li class="menu-item" onclick="alert('엑셀 데이터 내보내기')">💾 데이터 내보내기</li>
                        <li class="menu-item" onclick="alert('환경 설정')">🔧 환경설정</li>
                    </ul>
                </div>

            </div>

        </div>
    </div>

    <script>
        const viewPhoneHome = document.getElementById('view-phone-home');
        const viewSplash = document.getElementById('view-splash');
        const viewMain = document.getElementById('view-main');
        const sideMenu = document.getElementById('side-menu');
        const menuOverlay = document.getElementById('menu-overlay');

        // 앱 실행 제어 (3초 뒤 메인화면으로 부드럽게 이동)
        function startApp() {
            viewPhoneHome.style.display = 'none';
            viewSplash.classList.add('active');
            
            setTimeout(() => {
                viewSplash.classList.remove('active');
                viewSplash.style.display = 'none';
                viewMain.classList.add('active');
            }, 3000);
        }

        // 사이드 바 제어
        function toggleMenu(open) {
            if(open) {
                menuOverlay.style.display = 'block';
                sideMenu.classList.add('open');
            } else {
                menuOverlay.style.display = 'none';
                sideMenu.classList.remove('open');
            }
        }
    </script>
</body>
</html>
